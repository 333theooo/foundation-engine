name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything CI needs, in one place. No secrets: the AI provider runs in its
  # deterministic local mode, which is exactly why that mode exists.
  DATABASE_URL: postgresql://atrium:atrium@localhost:5432/atrium_test?schema=public
  AUTH_SECRET: ci-only-secret-that-is-long-enough-to-validate
  APP_URL: http://127.0.0.1:3100
  AI_PROVIDER: mock
  STORAGE_DRIVER: local
  LOCAL_STORAGE_DIR: ./storage/ci
  LOG_LEVEL: error
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: Types, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atrium
          POSTGRES_PASSWORD: atrium
          POSTGRES_DB: atrium_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atrium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run tests
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (standalone, as the container image does)
        run: npm run build
        env:
          BUILD_STANDALONE: 'true'
      - name: Confirm the standalone server was emitted
        run: test -f .next/standalone/server.js

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atrium
          POSTGRES_PASSWORD: atrium
          POSTGRES_DB: atrium_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atrium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atrium:atrium@localhost:5432/atrium_e2e?schema=public
      LOCAL_STORAGE_DIR: ./storage/e2e
      E2E_PORT: '3100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Write the server environment
        run: |
          cat > .env.e2e <<'ENVEOF'
          NODE_ENV=production
          DATABASE_URL=postgresql://atrium:atrium@localhost:5432/atrium_e2e?schema=public
          AUTH_SECRET=ci-only-secret-that-is-long-enough-to-validate
          APP_URL=http://127.0.0.1:3100
          AI_PROVIDER=mock
          STORAGE_DRIVER=local
          LOCAL_STORAGE_DIR=./storage/e2e
          ENABLE_GUEST_MODE=true
          LOG_LEVEL=error
          RATE_LIMIT_AI_PER_HOUR=1000
          RATE_LIMIT_AUTH_PER_HOUR=1000
          RATE_LIMIT_UPLOAD_PER_HOUR=1000
          ENVEOF
      - name: Run the end-to-end suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
