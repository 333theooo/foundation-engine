# Local infrastructure for Atrium Studio.
#
#   docker compose up -d          # Postgres and MinIO
#   npm run setup                 # install, generate, migrate, seed
#   npm run dev
#
# The application itself runs on the host by default, because that is the
# fastest edit-refresh loop. To run it in a container too:
#
#   docker compose --profile app up --build
#
# MinIO is optional: the default STORAGE_DRIVER=local needs no object storage at
# all. Start it when you want to exercise the S3 path before deploying.

name: atrium-studio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atrium
      POSTGRES_PASSWORD: atrium
      POSTGRES_DB: atrium
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atrium -d atrium']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ['storage']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atrium
      MINIO_ROOT_PASSWORD: atrium-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 6

  # Creates the bucket once MinIO is up, so S3 mode works without console steps.
  storage-init:
    image: minio/mc:latest
    profiles: ['storage']
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 atrium atrium-secret &&
      mc mb --ignore-existing local/atrium-studio &&
      echo 'bucket ready'
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ['app']
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://atrium:atrium@db:5432/atrium?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-at-least-32-characters}
      APP_URL: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /data/storage
    ports:
      - '3000:3000'
    volumes:
      - app-storage:/data/storage

volumes:
  db-data:
  storage-data:
  app-storage:
